name: Build and Push Docker image to Amazon ECR (Production)

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]

# Prevent concurrent deployments to the same environment
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
      ECR_REPOSITORY: 533267036621.dkr.ecr.eu-west-1.amazonaws.com/theportiqo-website
      VITE_GOOGLE_CLIENT_ID: 639125160298-bgr12tqd5ira2cb6kgkj4c9ds1iqrcdu.apps.googleusercontent.com
      VITE_BACKEND_URL: https://gw.theportiqo.com  # Production backend URL

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=prod-${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ env.VITE_GOOGLE_CLIENT_ID }}
            VITE_BACKEND_URL=${{ env.VITE_BACKEND_URL }}
          cache-from: type=registry,ref=${{ env.ECR_REPOSITORY }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.ECR_REPOSITORY }}:buildcache-prod,mode=max

      - name: Update image tag in ArgoCD values.yaml in external repo
        env:
          GITHUB_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/Tubuntu-Technologies/argocd.git
          cd argocd
          pip install yq
          yq -i -y '.image.tag = "${{ steps.tag.outputs.tag }}"' apps/theportiqo/website/config/prod/values.yaml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/theportiqo/website/config/prod/values.yaml
          git commit -m "Update theportiqo-website image tag to ${{ steps.tag.outputs.tag }} [skip ci]"
          git push